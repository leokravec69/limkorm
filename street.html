<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Лапки · Улица — прототип 3D</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fc0d8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
canvas{display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none}
.pill{background:rgba(20,28,22,.55);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
.big{font-size:15px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 22px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.btn{background:#2f4d34;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.notes{display:flex;gap:8px;flex-wrap:wrap;max-width:70%}
.note{background:rgba(255,255,255,.9);color:#26331f;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:700}
</style></head><body>
<div class="hud"><div class="pill big">🐕 Шакира · прогулка</div><div class="pill" id="dist">1,42 км · 12:41</div></div>
<div class="bottom"><div class="notes"><span class="note">👃 подбирал с земли</span><span class="note">🐾 встретили друзей</span></div><div class="btn">Погулять</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9d2e2, 40, 120);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// свет
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x5f7a4a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.1);
sun.position.set(18, 30, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);

// земля
const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 64), new THREE.MeshStandardMaterial({color:0x8fae6a, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// дороги: кольцо и две улицы
const roadMat = new THREE.MeshStandardMaterial({color:0x8d9196, roughness:.95});
function slab(w,d,x,z,rot=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.08,d),roadMat);m.position.set(x,0.04,z);m.rotation.y=rot;m.receiveShadow=true;scene.add(m);return m}
slab(90,7,0,0); slab(7,90,0,0);
const walkMat = new THREE.MeshStandardMaterial({color:0xc9b79a, roughness:1});
for (const s of [-1,1]) { const m=new THREE.Mesh(new THREE.BoxGeometry(90,0.06,2.2),walkMat); m.position.set(0,0.05,s*4.6); scene.add(m); }

// дома
const walls=[0xe8dfd2,0xdcd2c4,0xcdd6d2,0xe3d6c6,0xd9c9bb];
function building(x,z,w,d,h){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:walls[Math.floor(Math.random()*walls.length)],roughness:.9}));
  body.position.y=h/2; body.castShadow=true; body.receiveShadow=true; g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.5,.4,d+.5),new THREE.MeshStandardMaterial({color:0x8a6a55,roughness:.9}));
  roof.position.y=h+.2; roof.castShadow=true; g.add(roof);
  const winMat=new THREE.MeshStandardMaterial({color:0x8fb3c9, emissive:0x2a3f4d, emissiveIntensity:.5, roughness:.3, metalness:.2});
  for(let fy=2.2; fy<h-1; fy+=3.2){
    for(let fx=-w/2+1.6; fx<w/2-1; fx+=2.6){
      for(const side of [-1,1]){
        const win=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.5,.12),winMat);
        win.position.set(fx, fy, side*(d/2+.07)); g.add(win);
        const win2=new THREE.Mesh(new THREE.BoxGeometry(.12,1.5,1.3),winMat);
        win2.position.set(side*(w/2+.07), fy, fx*0.9); g.add(win2);
      }
    }
  }
  g.position.set(x,0,z); scene.add(g); return g;
}
for (let i=0;i<7;i++){ const s=i%2?1:-1; building(-30+i*10, s*16, 7, 7, 6+((i*7)%9)); }
for (let i=0;i<6;i++){ const s=i%2?-1:1; building(s*18, -26+i*9, 6, 7, 7+((i*5)%7)); }

// деревья
function tree(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.8,8),new THREE.MeshStandardMaterial({color:0x6b4a34}));
  trunk.position.y=.9; trunk.castShadow=true; g.add(trunk);
  const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25,1),new THREE.MeshStandardMaterial({color:0x4f7a3f,roughness:1,flatShading:true}));
  crown.position.y=2.35; crown.castShadow=true; g.add(crown);
  g.position.set(x,0,z); scene.add(g);
}
for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, r=8+Math.random()*26; const x=Math.cos(a)*r, z=Math.sin(a)*r; if(Math.abs(x)<5||Math.abs(z)<5)continue; tree(x,z); }

// собака из примитивов
const dog = new THREE.Group();
const fur = new THREE.MeshStandardMaterial({color:0xc98a52, roughness:.85});
const furDark = new THREE.MeshStandardMaterial({color:0xa96a38, roughness:.85});
const body = new THREE.Mesh(new THREE.CapsuleGeometry(.34,.62,8,16), fur); body.rotation.z=Math.PI/2; body.position.y=.62; body.castShadow=true; dog.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(.32,20,16), fur); head.position.set(.62,.82,0); head.castShadow=true; dog.add(head);
const snout = new THREE.Mesh(new THREE.CapsuleGeometry(.11,.16,6,10), furDark); snout.rotation.z=-Math.PI/2; snout.position.set(.93,.74,0); dog.add(snout);
for (const s of [-1,1]) {
  const ear=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10), furDark); ear.scale.set(1,.55,1.4); ear.position.set(.55,.88,s*.2); dog.add(ear);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,10,10), new THREE.MeshStandardMaterial({color:0x2a1c14})); eye.position.set(.88,.86,s*.12); dog.add(eye);
}
const tail=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.3,6,10), fur); tail.position.set(-.55,.85,0); tail.rotation.z=.6; dog.add(tail);
const legs=[];
for (const [x,z] of [[.32,.2],[.32,-.2],[-.32,.2],[-.32,-.2]]){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.42,6,10), fur); leg.position.set(x,.3,z); leg.castShadow=true; dog.add(leg); legs.push(leg);
}
dog.position.set(0,0,-6); scene.add(dog);

// маршрут-петля
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-4,0,-6), new THREE.Vector3(6,0,-6), new THREE.Vector3(9,0,0),
  new THREE.Vector3(6,0,9), new THREE.Vector3(-4,0,11), new THREE.Vector3(-9,0,4), new THREE.Vector3(-6,0,-3)
], true);
const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 240, .06, 6, true), new THREE.MeshBasicMaterial({color:0x2f4d34, transparent:true, opacity:.5}));
tube.position.y=.08; scene.add(tube);

// анимация
let t=0; const clock=new THREE.Clock();
const camPos = new THREE.Vector3(), camAt = new THREE.Vector3();
function tick(){
  const dt=Math.min(clock.getDelta(),.05); t+=dt*0.055; if(t>1)t-=1;
  const p=curve.getPointAt(t); const tan=curve.getTangentAt(t);
  dog.position.copy(p);
  const yaw=Math.atan2(tan.z,tan.x);
  dog.rotation.y=-yaw;
  const step=Math.sin(performance.now()/120);
  legs.forEach((l,i)=>{l.rotation.x=step*(i<2?1:-1)*0.5});
  tail.rotation.y=Math.sin(performance.now()/180)*.35;
  // камера от третьего лица
  const back=new THREE.Vector3(-tan.x,-0.0,-tan.z).multiplyScalar(6.2);
  camPos.set(p.x+back.x+ (tan.z)*2.2, 3.1, p.z+back.z - (tan.x)*2.2);
  camAt.set(p.x+tan.x*2.4, 0.9, p.z+tan.z*2.4);
  camera.position.lerp(camPos, .08);
  camera.lookAt(camAt);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
camera.position.set(0,4,3);
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
